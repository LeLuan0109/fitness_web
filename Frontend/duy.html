    <script nonce="+Jp2gUdLVO2hwb5+VG2a9g==" type="text/javascript">
        let language = localStorage.getItem("spro_language");
        if (language == null) {
            let browserLanguage = navigator.language;
            if (browserLanguage == "vi") {
                language = "vi";
            } else {
                language = "en";
            }
        }
        const queryString = window.location.search;
        // console.log(queryString);
        const urlParams = new URLSearchParams(queryString);
        const lang = urlParams.get('lang')
        if (lang == null) {
            var url = window.location.href;
            if (url.indexOf('?') > -1) {
                url += '&lang=' + language
            } else {
                url += '?lang=' + language
            }
            window.location.href = url;
        }

        function changeLanguage(value) {
            language = value;
            localStorage.setItem("spro_language", language);
            const urlParams = new URLSearchParams(queryString);
            const lang = urlParams.get('lang')
            if (lang != null) {
                let href = new URL(window.location.href);
                href.searchParams.set("lang", language);
                window.location.href = href.toString();
            } else {
                var url = window.location.href;
                if (url.indexOf('?') > -1) {
                    url += '&lang=' + language
                } else {
                    url += '?lang=' + language
                }
                window.location.href = url;
            }
        }

        function getHeaderFooter() {
            jQuery.ajax({
                url: "/rest/sms/latest/header-footer/getByDomain",
                type: "GET",
                dataType: 'json',
                async: true,
                cache: false
            }).done(
                function(data) {
                    if (data.headerLogin != null) {
                        jQuery('#logo_head').attr("src", data.headerLogin.image).show();
                    } else {
                        jQuery('#logo_head').hide()
                    }

                    if (data.footerLogin != null) {
                        jQuery('#logo_foot').attr("src", data.footerLogin.image).show();
                    } else {
                        jQuery('#logo_foot').hide()
                    }

                    // if (data.favicon != null) {
                    // 	let link = document.querySelector("link[rel*='icon']") || document.createElement('link');
                    // 	link.type = 'image/x-icon';
                    // 	link.rel = 'shortcut icon';
                    // 	link.href = data.favicon.image;
                    // 	document.getElementsByTagName('head')[0].appendChild(link);
                    // }

                    if (data.mobileAppLink != null) {
                        jQuery('#mobile-app-link').css('display', 'flex');
                        let mobileAppLinks = data.mobileAppLink.value.split(',');
                        jQuery('#ios-link').attr("href", mobileAppLinks[0]);
                        jQuery('#android-link').attr("href", mobileAppLinks[1]);
                    }

                    if (data.disableLoginWithAccount != null) {
                        jQuery('#login_with_account').hide();
                    }
                    // if (data.version !=null) {
                    // 	let versionLink = "<a style='margin: auto' href='"+ data.versionLink.value + "' target='_blank'>"+ data.version.webVersion +"</a>";
                    // 	jQuery('#version').html(versionLink);
                    // }
                }
            );
        }
        $(document).ready(function() {
            getHeaderFooter();
            /*==================================================================
            [ Validate ]*/
            var input = jQuery('.validate-input .input100');

            jQuery('.validate-form').on('submit', function() {
                var check = true;

                for (var i = 0; i < input.length; i++) {
                    if (validate(input[i]) == false) {
                        showValidate(input[i]);
                        check = false;
                    }
                }

                return check;
            });


            jQuery('.validate-form .input100').each(function() {
                jQuery(this).focus(function() {
                    hideValidate(this);
                });
            });

            function validate(input) {
                if (jQuery(input).val().trim() == '') {
                    return false;
                }
            }

            function showValidate(input) {
                var thisAlert = jQuery(input).parent();
                jQuery(thisAlert).addClass('alert-validate');
            }

            function hideValidate(input) {
                var thisAlert = jQuery(input).parent();
                jQuery(thisAlert).removeClass('alert-validate');
            }
            document.forms['form_login'].addEventListener('submit', (event) => {
                event.preventDefault();
                // TODO do something here to show user that form is being submitted
                run_waitMe("#form_login", 1, "progressBar", "processing.please.wait");
                fetch(event.target.action, {
                    method: 'POST',
                    redirect: 'follow',
                    body: new URLSearchParams(new FormData(event.target)) // event.target is the form
                }).then((resp) => {
                    jQuery("#form_login").waitMe('hide');
                    if (resp.redirected) {
                        if (!resp.url.includes("/login.jspa")) {
                            const Toast = Swal.mixin({
                                toast: true,
                                position: 'top-end',
                                showConfirmButton: false,
                                timer: 2000,
                                timerProgressBar: false,
                            })
                            Toast.fire({
                                icon: 'success',
                                title: "login.successfully"
                            })
                        }
                        window.location.href = resp.url;
                    } else {
                        jQuery("html").html(resp);
                    }
                }).then((body) => {
                    jQuery("#form_login").waitMe('hide');
                }).catch((error) => {
                    jQuery("#form_login").waitMe('hide');
                });
            });
            startLockoutCountdown();

            function startLockoutCountdown() {
                const lockoutMessage = document.getElementById('login-lockout-message');
                if (!lockoutMessage) {
                    return;
                }
                const lockUntil = Number(lockoutMessage.getAttribute('data-lock-until'));
                const messageTemplate = lockoutMessage.getAttribute('data-message-template');
                if (!lockUntil || !messageTemplate) {
                    return;
                }
                let countdownTimer = null;
                const updateMessage = function() {
                    const remainingMs = lockUntil - Date.now();
                    if (remainingMs <= 0) {
                        lockoutMessage.style.display = 'none';
                        window.clearInterval(countdownTimer);
                        return;
                    }
                    const remainingMinutes = Math.ceil(remainingMs / 60000);
                    lockoutMessage.textContent = messageTemplate.replace('__LOCKOUT_MINUTES__', remainingMinutes);
                };
                updateMessage();
                countdownTimer = window.setInterval(updateMessage, 1000);
            }
        });
    </script>
</head>
