# Docker Compose: chạy Backend + MySQL chỉ với 1 lệnh.
# Lần đầu trên máy mới: chỉ cần cài Docker Desktop rồi chạy:  docker compose up -d --build
#
# - MySQL tự khởi tạo database 'fitness_db'
# - Flyway trong backend tự tạo toàn bộ bảng + seed dữ liệu chung (V1..V21) khi start
# - Backend phục vụ tại http://localhost:8055  (prefix API: /api)
#
# ---- LAPTOP LÀM SERVER (điện thoại/APK gọi qua WiFi) --------------------------
# Cổng backend được publish trên 0.0.0.0 nên MỌI thiết bị cùng WiFi truy cập được:
#   Laptop:      http://localhost:8055/swagger-ui/index.html
#   Điện thoại:  http://<IP-LAN-CỦA-LAPTOP>:8055/swagger-ui/index.html
# Lấy IP laptop:  ipconfig  ->  dòng "IPv4 Address" (vd 192.168.1.10)
# APK đặt BASE_URL = http://<IP-LAN>:8055/  (KHÔNG dùng localhost/10.0.2.2 khi chạy máy thật)
#
# ⚠️ compose KHÔNG mở được Windows Firewall. Nếu điện thoại không vào được, chạy 1 lần
#    trong PowerShell (Admin) trên laptop:
#    netsh advfirewall firewall add rule name="Fitness 8055" dir=in action=allow protocol=TCP localport=8055
# -----------------------------------------------------------------------------

services:
  mysql:
    image: mysql:8.0
    container_name: fitness-mysql
    restart: unless-stopped
    # lower_case_table_names=1 để khớp môi trường dev (tên bảng không phân biệt hoa/thường).
    # Chỉ có hiệu lực khi volume còn TRỐNG (lần khởi tạo đầu). Không đổi giá trị này trên volume cũ.
    command: --lower-case-table-names=1
    environment:
      MYSQL_ROOT_PASSWORD: fitness123
      MYSQL_DATABASE: fitness_db
    ports:
      # Cổng host đổi sang 3307 để tránh đụng MySQL khác đang chạy ở 3306.
      # Backend kết nối qua mạng nội bộ (mysql:3306) nên không bị ảnh hưởng.
      # Muốn nối từ host (Workbench/DBeaver) thì dùng localhost:3307.
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pfitness123"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  backend:
    build: .
    container_name: fitness-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      # Trỏ datasource sang service 'mysql' (KHÔNG dùng localhost trong container).
      # Override các giá trị trong application.properties qua biến môi trường (Spring relaxed binding).
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/fitness_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true"
      SPRING_DATASOURCE_USERNAME: "root"
      SPRING_DATASOURCE_PASSWORD: "fitness123"
    ports:
      # Bind rõ trên mọi card mạng (0.0.0.0) để điện thoại cùng WiFi gọi được qua IP LAN.
      - "0.0.0.0:8055:8080"

volumes:
  mysql_data:
