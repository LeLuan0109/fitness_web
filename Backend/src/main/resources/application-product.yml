# ============================================================================
# Profile PRODUCT  - kích hoạt bằng:  SPRING_PROFILES_ACTIVE=product
# ----------------------------------------------------------------------------
# Chỉ override các giá trị KHÁC với application.yml (base) cho môi trường production.
# Mọi secret/cấu hình đọc từ biến môi trường theo cú pháp ${ENV:default}
#   -> chưa set env thì dùng default; docker-compose-product.yml sẽ truyền env vào.
# ============================================================================
spring:
  datasource:
    # DB ngoài (mặc định 10.10.100.100:3311)
    url: "jdbc:mysql://${DB_HOST:10.10.100.100}:${DB_PORT:3311}/${DB_NAME:fitness_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true"
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:fitness123}

  jpa:
    # Tắt log SQL ở production
    show-sql: false

  mail:
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}

  ai:
    openai:
      api-key: ${GEMINI_API_KEY:AIzaPLACEHOLDER}

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}

logging:
  level:
    root: INFO
    org:
      springframework:
        security: WARN

jwt:
  secretKey: ${JWT_SECRET_KEY:eybb+/++uLfMDzpiLPeyPdvPpAtYDxYSsfBNp5RSSaU=}

app:
  oauth2:
    redirect-uri: ${OAUTH2_REDIRECT_URI:http://localhost:5173/oauth2/redirect}

open:
  api:
    serverUrl: ${OPENAPI_SERVER_URL:http://localhost:8080}

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:demo}
  api-key: ${CLOUDINARY_API_KEY:000000000000000}
  api-secret: ${CLOUDINARY_API_SECRET:demo_secret}
