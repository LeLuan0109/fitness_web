# ============================================================================
# Profile PRODUCT  - kích hoạt bằng:  SPRING_PROFILES_ACTIVE=product
# ----------------------------------------------------------------------------
# CHỈ override thứ KHÁC theo môi trường production. Các secret dùng chung
# (Cloudinary, Gemini, Google OAuth, Mail, JWT) KẾ THỪA từ application.yml (base).
#
# Giá trị đọc từ biến môi trường ${ENV:default}; docker-compose-product.yml truyền env vào.
#   - DB: server thật 10.10.100.100:3311 (root/fitness123)
# ============================================================================
spring:
  datasource:
    url: "jdbc:mysql://${DB_HOST:10.10.100.100}:${DB_PORT:3311}/${DB_NAME:fitness_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true"
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:fitness123}

  jpa:
    # Tắt log SQL ở production
    show-sql: false

  # DB trên server thật được nạp trực tiếp bằng file SQL -> KHÔNG chạy Flyway.
  # (tránh lỗi khi bảng/dữ liệu đã tồn tại hoặc migration đang ở trạng thái failed)
  flyway:
    enabled: false

logging:
  level:
    root: INFO
    org:
      springframework:
        security: WARN

# URL công khai theo domain production (override khi deploy domain thật)
app:
  oauth2:
    redirect-uri: ${OAUTH2_REDIRECT_URI:http://localhost:5173/oauth2/redirect}

open:
  api:
    serverUrl: ${OPENAPI_SERVER_URL:http://localhost:8080}
