spring.application.name=DoanBE
server.port=8080

# MySQL (Docker container fitness-mysql)
spring.datasource.url=jdbc:mysql://localhost:3306/fitness_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=fitness123

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

#OAUTH Config (placeholder - chưa dùng)
spring.security.oauth2.client.registration.google.client-id={your_client_id}
spring.security.oauth2.client.registration.google.client-secret={your_client_secret}
spring.security.oauth2.client.registration.google.scope=email, profile

#GMAIL SMTP (placeholder - chưa dùng)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username={your_username}
spring.mail.password={your_pw}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

logging.level.org.springframework.security=DEBUG

#JWT
jwt.expiration = 2592000
jwt.expiration-refresh-token = 5184000
jwt.reset-password-expiration = 600
jwt.secretKey = eybb+/++uLfMDzpiLPeyPdvPpAtYDxYSsfBNp5RSSaU=

#API_PREFIX
api.prefix = api
app.oauth2.redirect-uri=http://localhost:5173/oauth2/redirect

#SWAGGER
open.api.title=Fitness Service Documents
open.api.version=v.1.0.0
open.api.serverUrl=http://localhost:8080

# Cloudinary (placeholder - chưa dùng, upload ảnh sẽ lỗi cho tới khi điền)
cloudinary.cloud-name=demo
cloudinary.api-key=000000000000000
cloudinary.api-secret=demo_secret

#File size
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Gemini AI (placeholder - chatbot sẽ lỗi cho tới khi điền key thật)
spring.ai.openai.api-key=AIzaPLACEHOLDER
spring.ai.openai.base-url=https://generativelanguage.googleapis.com/v1beta/openai/
spring.ai.openai.chat.options.model=gemini-2.5-flash
spring.ai.openai.chat.options.temperature=0.7
